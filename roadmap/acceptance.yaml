# Acceptance criteria and automated test cases, as data.
#
# The reasoning for each feature lives in its markdown spec; what "done" means lives here, so it
# can be ticked off, counted and checked by a tool without parsing prose. One entry per feature
# id, in roadmap order. This file is the single source: the specs point at it rather than
# repeating it.

schemaVersion: 1

features:
  F001:
    title: "Workspace, local database, and snapshot state"
    spec: "01-workspace-and-snapshots.md"
    acceptance:
      - "`veriflow init <path>` on a clean repository creates the workspace, the database, and exactly one committed-canonical file."
      - "`veriflow init` on a directory that is not a Git working tree fails immediately, names the reason, and creates nothing."
      - "Re-running `init` changes no bytes and reports `Already initialized`."
      - "Unknown legacy `.veriflow/` content is preserved; a legacy `.env.local` is never read or printed; a conflicting owned path fails without overwriting."
      - "With `.veriflow/` ignored by a parent `.gitignore`, only `config.yaml` becomes trackable."
      - "`doctor` reports every probe, exits `0` when VeriFlow can run at all, and names the install command for each missing dependency, including Python for the provider."
      - "Capturing a snapshot of a repository with uncommitted changes records `dirty: true`, the commit sha, the branch, and a hash per indexable file — and `git status` is byte-identical before and after."
      - "Excluded paths and `.env*` files appear in no hash set."
      - "After editing three files, change detection reports exactly those three, with no commit involved."
      - "Renaming a file is reported as a rename, or as delete plus add with both paths named — never as silence."
      - "Capturing a snapshot of `main-panel` completes within a stated time budget and streams progress."
      - "`status --json` and `doctor --json` are machine-readable and versioned."
      - "Two concurrent commands on one project do not corrupt the database."
      - "No command performs a Git mutation or a network request — asserted by tests that fail on either."
    tests:
      - "init on a Git repository, idempotent re-init, and refusal on a non-Git directory;"
      - "legacy coexistence, owned-path conflict, ignored-secret non-read;"
      - "gitignore exception and `check-ignore` verification;"
      - "store migration from empty, and reopen of an existing database;"
      - "hash-set capture: content change, whitespace-only change, mode change;"
      - "exclusion of default and configured excludes, and of `.env*` by path;"
      - "change detection: modify, add, delete, rename, and no-change;"
      - "dirty flag with and without uncommitted changes;"
      - "snapshot capture in a repository with no commits yet — hashes still work, commit absent;"
      - "progress streaming and bounded memory on a large fixture;"
      - "concurrent access under the lock;"
      - "`doctor` with the provider absent, Python absent, a client absent, and all present;"
      - "Git-mutation and network assertions;"
      - "Windows and POSIX path separators over the same fixtures."
  F002:
    title: "Code intelligence provider protocol and code-review-graph adapter"
    spec: "02-code-intelligence-provider.md"
    acceptance:
      - "`veriflow index` on `main-panel` produces an indexed snapshot with file, symbol, import, and call-site counts in the store, and reports them."
      - "Indexing streams progress and can be cancelled without leaving a half-usable index."
      - "A second `index` after editing a few files uses the incremental path and reports the changed-file count."
      - "Capability probing reports `callSiteLines` from a real probe, and F003 consumes that value."
      - "`flowQuality` records TypeScript as weak, and the UI and `doctor` surface it."
      - "`changedFiles(snapshot)` matches F001's own hash-based change detection, or the difference is explained."
      - "Community and overview data are ingested and queryable."
      - "No source file outside `packages/provider-crg` references the provider by name — asserted by a test."
      - "`refactor_tool` and `apply_refactor_tool` are never invoked and never registered — asserted."
      - "The contract test suite passes against both the real adapter and the fake provider."
      - "Malformed, truncated, or slow provider output is handled with a diagnostic rather than propagated."
      - "With the provider or Python uninstalled, `veriflow index` fails with an actionable message and every other command still works."
      - "`.code-review-graph/` is never written or deleted by VeriFlow — asserted by checksum around a run."
    tests:
      - "contract suite against the fake provider;"
      - "contract suite against recorded provider fixtures;"
      - "capability probe matrix, including `callSiteLines` false;"
      - "degradation when `flows` is false and when `flowQuality` marks a language weak;"
      - "index cancellation leaves `unindexed`;"
      - "incremental update after a file edit;"
      - "store ingestion idempotence — indexing twice does not duplicate rows;"
      - "evidence ID stability across two ingestions of one snapshot;"
      - "malformed, truncated, and timing-out provider output;"
      - "provider absent, Python absent, wrong provider major version;"
      - "assertion that no import outside the adapter names the provider;"
      - "assertion that no refactor tool is ever invoked;"
      - "`changedFiles` cross-check against F001 hashes, including a rename;"
      - "provider index directory untouched, by checksum."
  F003:
    title: "Reachability, module registry, and function-level call graph"
    spec: "03-reachability-and-call-graph.md"
    acceptance:
      - "On `main-panel`'s checkout and webhook routes, reachability returns functions in the hundreds and excludes helpers that merely live in a reached file without being called. If the provider's TypeScript resolution measured in the Q2 spike cannot support that figure, the target is renegotiated against measured capability and the gap is stated in the UI — see [Q13](open-questions.md#q13--what-is-the-fallback-if-the-providers-typescript-resolution-disappoints)."
      - "Module initialization of a reached file is included, and the reason is inspectable — this is why a logger factory appears on every path with no caller."
      - "The payment-gateway port dispatch appears as a `port` edge, marked inferred, with its rule named."
      - "The event-subscriber callback appears as a `callback` edge; disabling that rule provably removes the tax document, both calendar syncs, and the notification from the graph."
      - "Getter methods and other known false-positive shapes do not produce callback edges."
      - "Buckets reconcile exactly to the total call-site count."
      - "Filtering to `POST /api/marketplace/checkout` yields a strict subset of the full closure, and the other routes' subtrees are absent from it."
      - "The traffic matrix's backward-edge list is explicit, with counts and a note per edge."
      - "Indexing `main-panel` alone — with no agent run at all — produces a module registry that a developer recognizes as the application's architecture: its layers, its explicit modules, and the traffic between them."
      - "Module ids survive a re-index after unrelated files change, so an answer stored earlier still resolves."
      - "Two runs on the same snapshot produce byte-identical layout coordinates."
      - "A symbol that exists in two snapshots keeps its node identity."
      - "`--json` output is versioned and complete enough to rebuild every view."
    tests:
      - "reachability on a small fixture with a deliberately unreached sibling helper;"
      - "module-init inclusion, and its exclusion when the file is never reached;"
      - "callback lambda collapsed into its parent;"
      - "port rule: adapter defining exactly the port's declared names;"
      - "port rule negative: a same-named method on an unrelated object is not linked;"
      - "callback rule positive, and the subtree loss when disabled;"
      - "callback rule negative on getters;"
      - "bucket reconciliation, including a package with several call sites;"
      - "per-entry-point closure subset property across all entry points;"
      - "traffic matrix orientation and backward-edge detection;"
      - "layout determinism across platforms and across two runs;"
      - "node identity stability between two snapshots;"
      - "depth bound reached is reported, not silently truncated."
  F004:
    title: "Streamed agent session with the user's own client"
    spec: "04-agent-session.md"
    acceptance:
      - "`veriflow ask` starts the configured client and streams assistant output, tool calls, and tool results to the terminal as they happen."
      - "The same run streams to a consumer that attaches after it started, with no gap and no duplicate."
      - "An `ask_user` call parks the run, appears in both surfaces, and resumes with the user's answer, which is stored."
      - "An unanswered question hits its timeout and ends the run as `timed-out` with a partial transcript."
      - "Cancel terminates the process tree within a bounded time and stores `cancelled`."
      - "The client is launched in read-only permission mode, the mode is displayed before the run, and the registered tool list contains no write, exec, or refactor tool."
      - "After a completed run, the project's tracked files are byte-identical and `git status` is unchanged."
      - "Both Claude Code and Codex complete a run from the same evidence bundle; wording differs, contract and safety behavior do not."
      - "A client whose installed version lacks structured streaming falls back to PTY and produces the same normalized events."
      - "No `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, or equivalent is read, requested, or stored."
      - "The exposed MCP surface contains no tool that writes canonical state, edits source, runs a command, or mutates Git — asserted by a test over the tool list."
      - "Killing VeriFlow mid-run leaves no orphan process and no leftover MCP config file."
      - "Reopening a stored run replays its transcript in order."
    tests:
      - "fake client happy path with a full event stream;"
      - "late-attaching consumer replay-then-follow;"
      - "`ask_user` round trip, including a second question in the same run;"
      - "unanswered question timeout;"
      - "cancel during a tool call, and process-tree termination;"
      - "PTY fallback normalization against the structured path on the same fixture;"
      - "capability probe on an old client version;"
      - "client not found, client exits non-zero, client emits malformed events;"
      - "tool-list assertion: no write, exec, or Git tool;"
      - "environment hygiene — no unexpected variable reaches the child;"
      - "per-run MCP config generation and cleanup, including after a simulated crash;"
      - "transcript rendering treats agent output as untrusted;"
      - "read-only mode assertion, filtered provider tool list, and tree-unchanged check after a run."
  F005:
    title: "Flow answer contract, question intake, and citation verification"
    spec: "05-flow-answer-contract.md"
    acceptance:
      - "Asking *\"Jak funguje rezervace a zaplacení lekce?\"* on `main-panel` ranks the checkout and Stripe webhook routes among the top candidates."
      - "The evidence bundle manifest is shown before the run and contains no absolute path or excluded content."
      - "A valid answer stores lanes, phases, steps in order, branches with invariants, module edges with contracts, external systems with boundaries, and open questions."
      - "Every citation is verified at submit time and stored with its state; the answer carries its verified ratio and no claim is silently unlabelled."
      - "An unresolvable citation is stored as `unverified` and displayed as such, rather than discarding the answer."
      - "Each structural rejection rule triggers on a crafted fixture and produces its stable diagnostic code."
      - "A rejected submission is reported back inside the run and a corrected resubmission succeeds."
      - "A structurally malformed submission is rejected outright, and only for structural reasons."
      - "An agent that cannot evidence a claim reaches `record_open_question`, and that outcome is treated as success rather than failure by the run and by the UI."
      - "A location question is classified before any run starts, redirected with a reason, and the classification can be overridden in one click."
      - "A clearly leading entry point starts the run without asking; an ambiguous ranking asks; the margin is printed either way."
      - "A follow-up answer stores its parent reference and receives the parent answer in its brief."
      - "Module edits made by the agent land in the project registry with provenance, and an answer stored before a later rename still resolves correctly because it references ids."
      - "A human correction is stored with author and original value, and the corrected text is what the UI, the export, and MCP serve."
      - "A step the agent cannot evidence appears as an open question rather than as narrated prose."
      - "The generated mermaid source declares every participant it uses."
      - "Persistence is atomic under a simulated failure mid-write."
      - "`veriflow answers --json` lists stored answers with their question, snapshot, and counts."
      - "The same fixtures validate identically on both platforms."
    tests:
      - "entry-point ranking on fixtures, including an ambiguous case that requires confirmation;"
      - "bundle manifest determinism and exclusion of secret paths;"
      - "valid answer round trip: submit, validate, persist, read back;"
      - "one fixture per structural rejection rule;"
      - "citation resolution against a snapshot, including a line at end of file and a symbol on a moved line;"
      - "citation state fixtures: verified, unverified, and open-question, plus the verified ratio;"
      - "resubmission after a structural rejection within one run;"
      - "classifier fixtures: flow question, location question, ambiguous question, and an override;"
      - "entry-point auto-start above the margin, ask below it;"
      - "follow-up parent link and brief contents;"
      - "module registry: agent rename, merge, split; id stability across a rename; older answer still resolves;"
      - "correction record: author, original value, and precedence in UI, export, and MCP output;"
      - "open-question linkage for an unevidenced step;"
      - "mermaid participant declaration check;"
      - "atomic persistence under an injected write failure;"
      - "size budget enforcement;"
      - "contract-version rejection;"
      - "cross-platform validation parity."
  F006:
    title: "Local UI over stored answers"
    spec: "06-answer-ui.md"
    acceptance:
      - "`veriflow open` serves the SPA on `127.0.0.1` and prints the root and URL."
      - "After indexing `main-panel` and before any run, the Architecture screen shows the generated module registry and the traffic between modules."
      - "The answers list shows every stored answer with its snapshot, commit, verified ratio, and freshness banner."
      - "A claim's citation state — verified, unverified, or open question — is visible wherever the claim is, and an unverified claim is never styled as a verified one."
      - "Asking a question from the UI runs the F004 session with live streamed output, a working `ask_user` prompt, and a functioning cancel."
      - "A location question is caught before the run, explains itself, and can be overridden in one click."
      - "A clear entry point starts the run without a confirmation click and is visible in the console; an ambiguous one presents the candidates."
      - "Correcting a step marks it as edited, keeps the original reachable, and closing a demoted step's open question by hand works end to end."
      - "A follow-up answer renders under its parent, not as an unrelated sibling."
      - "Opening the UI mid-run shows the run from its beginning and then keeps up."
      - "The flow diagram renders the answer's lanes, phase bands, and ordered steps."
      - "Selecting any step shows its reasoning and its file references, and the references open in the editor."
      - "The paths screen groups outcomes by divergence phase, states each invariant, and dims the shared prefix from the fork."
      - "The modules screen shows the contract on every edge and marks inferred edges."
      - "The external screen names the boundary and the failure behavior for each system."
      - "The call graph's three views render from stored coordinates; entry-point filtering dims rather than reflows; the call mesh is off by default."
      - "Reopening any screen after a restart recomputes nothing — asserted by an absence of provider and layout calls."
      - "Geometry assertions pass: no stray edge crossings, no overlapping boxes, every branch forks from a real step."
      - "Both themes render every screen; server-side rendering of the shell produces the question, the participants, the phase bands, and the freshness banner."
      - "No screen writes to the repository or the model."
    tests:
      - "server starts, binds loopback only, serves the SPA;"
      - "rendered shell contains question, participants, phase bands, freshness banner;"
      - "run console replay-then-follow, `ask_user` submit, cancel;"
      - "step selection resolves the right evidence rows;"
      - "paths grouping and prefix dimming for each tone;"
      - "module edge contract and inferred marking;"
      - "call graph three views from stored coordinates;"
      - "entry-point filter produces a dimmed subset without layout change;"
      - "node budget degradation path;"
      - "geometry assertions over the stored layout;"
      - "no-recompute assertion on open;"
      - "theme snapshots;"
      - "untrusted transcript rendering."
  F007:
    title: "Freshness, drift, and re-verification"
    spec: "07-freshness-and-drift.md"
    acceptance:
      - "An answer whose cited files are untouched verifies as `fresh`, in well under a second, and says how many files it checked."
      - "Editing a cited file without committing immediately moves the answer off `fresh`."
      - "Editing an unrelated file does not change the state."
      - "Moving a cited function within its file is classified `drifted`, with the new line recorded."
      - "Deleting a cited function is `missing`; deleting or renaming its file is `file-missing`."
      - "A match found at the edge of the search window is reported `low` confidence."
      - "The freshness state matches the printed thresholds for each of the four cases."
      - "Verification with the provider accelerator gives the same result as a full verification, and reports how many files it skipped."
      - "An answer captured from a dirty tree carries `dirtyAtCapture` into every later verification."
      - "Removing the flow's entry point produces `broken`."
      - "The UI shows per-reference drift with a working jump to the new location."
      - "An answer diff between two tree states names moved evidence, lost branches, and vanished nodes."
      - "Re-answering creates a new answer, marks the old one `superseded`, and both remain readable."
      - "`verify --json` is versioned and complete."
      - "No agent process starts during verification — asserted."
    tests:
      - "no-change verification, including the near-free path and its reporting;"
      - "uncommitted edit to a cited file, and to an unrelated file;"
      - "drift: function moved down, moved up, moved across a large edit;"
      - "low-confidence drift at the search-window edge;"
      - "missing symbol, missing file, renamed file;"
      - "state threshold matrix, all four states;"
      - "accelerator parity against full verification, plus skipped-count reporting;"
      - "dirty-at-capture propagation;"
      - "entry point removed → `broken`;"
      - "answer diff fixtures: moved evidence, lost branch, vanished call-graph node;"
      - "supersede lifecycle and readability of the old answer;"
      - "commits-since reported when Git is present, absent when it is not;"
      - "progress streaming and bounded runtime on a large fixture;"
      - "assertion that no agent process starts."
  F008:
    title: "Flow metrics — debt, structure, coupling, coverage proxy"
    spec: "08-flow-metrics.md"
    acceptance:
      - "Metrics for the `main-panel` answer cover exactly the files the flow touches, and the count is stated."
      - "Hotspot ranking uses snapshot git history and is reproducible."
      - "Per-function CCN, NLOC, nesting, cognitive complexity, and hump count are produced, with Complex Method, Bumpy Road, and Brain Method flags where they apply."
      - "Circular dependencies, fan-in/fan-out, instability, and duplicated blocks are reported for the flow's files."
      - "The spaghetti index prints its formula and band next to the value, and provably ignores history."
      - "At least the known contradiction on `main-panel` is visible: a high structural index alongside a single nesting hump, both shown, not averaged."
      - "Entries where the measure misreads the code carry a caveat, displayed with the number."
      - "Coverage identifies alternative outcomes with no test naming their identifier, and labels the method as a proxy in the view."
      - "Two runs on one snapshot produce identical output."
      - "Without git history, history-based metrics report unavailable with a reason."
      - "`metrics --json` is versioned and complete enough to rebuild every view."
      - "No project script, test, or build is executed."
    tests:
      - "scope selection from reachability and citations;"
      - "complexity and hotspot on a fixture with known revision counts;"
      - "per-function metrics against hand-computed fixtures for CCN, nesting, and cognitive complexity;"
      - "nesting-hump detection: one continuous block versus repeated humps;"
      - "Bumpy Road and Brain Method thresholds at and around the boundary;"
      - "cycles, fan-in/fan-out, instability on a fixture with a known cycle;"
      - "duplication detection with a near-duplicate that must not match;"
      - "change coupling ratio from fixture history;"
      - "spaghetti index formula, banding, and history-independence assertion;"
      - "caveat attachment and rendering;"
      - "coverage proxy: covered, partial, and gap fixtures, plus an identifier that appears only in a comment;"
      - "determinism across two runs and both platforms;"
      - "no-history fallback;"
      - "assertion that no project process is spawned."
  F009:
    title: "Document export and portable backup"
    spec: "09-document-export.md"
    acceptance:
      - "Exporting the `main-panel` answer writes one new markdown file under the configured flow export path, and changes nothing else in the repository."
      - "The generated mermaid renders on GitHub and declares every participant it uses."
      - "The document contains the phases, the alternative outcomes with their invariants, the module contracts, the external systems, the open questions, and the references."
      - "Frontmatter matches the configured convention with `status: draft`, an owner placeholder, and `last-reviewed`."
      - "Approval shows a rendered preview and the exact diff before writing."
      - "Creating over an existing path fails; updating requires the expected revision and returns a conflict when the file changed externally."
      - "A simulated write failure leaves the original file byte-identical."
      - "Re-exporting an unchanged answer produces no diff."
      - "Exporting a stale answer records its freshness in the document and requires confirmation."
      - "Path traversal, symlink escape, and a target outside a documentation root are all rejected."
      - "`veriflow export --json --all` dumps every entity, and importing it into an empty database restores the answers, their citations, verifications, and transcripts."
      - "No Git command runs anywhere in this feature — asserted by a test that fails on any Git invocation."
    tests:
      - "mermaid generation for each step kind, with participant declaration checks;"
      - "mermaid generation for an answer with branches, asserting the happy path is what is drawn;"
      - "markdown generation determinism, byte equality across two runs;"
      - "frontmatter conventions, default and configured;"
      - "create on new path, create over existing path, update with correct and stale revision;"
      - "atomic write failure preserving the original, on NTFS and POSIX;"
      - "path traversal, symlink escape, outside-root rejection;"
      - "stale-answer export confirmation gate;"
      - "JSON dump and restore round trip, including transcripts and their exclusion flag;"
      - "absence of absolute paths in both document and dump;"
      - "Git-invocation assertion."
  F010:
    title: "VeriFlow MCP server for design and review"
    spec: "10-mcp-server.md"
    acceptance:
      - "An agent connected over stdio lists the stored `main-panel` answers and reads one in full."
      - "Every response includes snapshot, freshness, and review state — asserted for every tool, with no exceptions and no tool able to opt out."
      - "An unreviewed answer is served with `review.state === \"unreviewed\"` and its open-question count, and the tool description tells the agent what that means."
      - "An answer carrying human corrections reports the correction count, and the corrected text is what is served."
      - "`get_flow_paths` returns each alternative outcome with the invariant it protects."
      - "`get_architecture` returns the module registry with stable ids and the traffic between modules, so an agent can orient before reading any flow."
      - "Metrics tools are absent from the tool list until F008 ships, rather than present and returning nothing."
      - "`get_call_graph` with an entry point returns that route's closure; inferred edges are labelled in the payload."
      - "`get_callers` on an ambiguous symbol returns candidates rather than picking one."
      - "A large call graph response truncates with a cursor and reports the totals."
      - "The tool list contains no write, exec, or Git tool — asserted."
      - "The server starts with the provider uninstalled and serves stored answers."
      - "A design question — *\"what must I respect before changing `fulfillLessonCheckout`?\"* — is answerable from tools alone, and the answer names the invariants and the module contract."
      - "A review question — *\"which flows and failure paths does this change touch, and what invariants do they protect?\"* — is answerable from tools alone. The \"and which of them are untested\" half of that question becomes answerable when F008 adds the coverage tools."
      - "Both questions are demonstrated with Claude Code and with Codex."
      - "The fake MCP client exercises every tool in CI, with no model and no network."
    tests:
      - "tool list assertion: no write, exec, or Git tool;"
      - "envelope presence on every tool response;"
      - "each tool against fixtures, including empty and single-row cases;"
      - "truncation and cursor round trip on a large graph;"
      - "ambiguous symbol returns candidates;"
      - "stale answer served with its state rather than withheld;"
      - "provider-absent startup;"
      - "resource read for a whole answer;"
      - "inferred-edge and proxy labelling inside payloads;"
      - "fake client end-to-end for the design workflow;"
      - "fake client end-to-end for the review workflow;"
      - "no network listener is opened."
