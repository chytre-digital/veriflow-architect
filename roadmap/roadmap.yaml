# Machine-readable roadmap index.
#
# The reasoning lives in README.md and in each feature's markdown spec. This file carries the
# structure a tool needs: order, iteration, dependencies, status. Acceptance criteria and test cases
# live in acceptance.yaml, decisions in decisions.yaml, open questions in questions.yaml.

schemaVersion: 1

# Feature status vocabulary:
#   ready   — the spec is implementable; nothing is built yet.
#   shipped — implemented, with its acceptance criteria met except where `gaps` says otherwise.
#
# `shipped` never means finished. A feature with a `gaps` list is shipped and partial, and the list
# is the whole of what is missing — the D19 rule applies to this file too: partial is fine, silently
# partial is not.

project:
  name: VeriFlow
  goal: "Generate an application's architecture and make review possible against it."
  repository: this repository — apps/ and packages/ alongside docs/ and roadmap/
  requiresGit: true

iterations:
  - id: M1-answer
    name: Generate the architecture
    features: [F001, F002, F003, F004, F005, F006]
    done: >-
      From nothing but a repository path: the project's generated architecture plus a stored flow
      answer for the acceptance question, every claim carrying a citation state, and the target's
      git status unchanged afterwards. Exercised once with Claude Code and once with Codex.
  - id: M2-review
    name: Review against it
    features: [F010, F007]
    done: >-
      An agent on veriflow mcp answers a design question and a review question from tools alone,
      with snapshot, freshness and review state on every response; an answer whose cited files
      changed reports its drift correctly.
  - id: M3-depth
    name: Depth
    features: [F008, F009]
    done: >-
      Metrics cover the flow's files with contradictions visible rather than averaged, and an
      approved answer exists as committed markdown with a rendering mermaid diagram.
  - id: M4-many
    name: More than one answer
    features: [F011]
    done: >-
      With several answers stored, the project screen names the modules no answer reaches, the
      shared modules name the flows that meet in them, and an agent asking what a change to one
      file affects is answered from stored citations rather than from a re-read of the code.
  - id: M5-design
    name: Design against it
    features: [F012, F013, F014, F015, F016, F017]
    done: >-
      A feature's written claims can be checked against the code they cite; a diff against a base
      ref names the stored flows its hunks land in; a person can review an answer and decide its
      open questions; and an observed flow can produce a proposed successor whose changed steps,
      lanes, modules and contracts are visible in one reviewable overlay before implementation.

features:
  F001:
    title: Workspace, local database, and snapshot state
    spec: 01-workspace-and-snapshots.md
    iteration: M1-answer
    status: shipped
    dependsOn: []
    outcome: >-
      init/doctor/status; the tree state recorded by file hash without copying or mutating anything.
    notes: >-
      `.veriflowignore` was added after the call graph of this repository came back with two doors,
      both of them Next.js routes inside the design mockups. There had been one exclusion mechanism
      and it was not enough in two separate ways: it matched directory names rather than paths, so
      `artifacts/mockups` could not be said at all, and it applied only to the hash walk, so a
      directory kept out of the tree state still supplied symbols, modules, entry points and call
      graph nodes. The file is gitignore syntax, applied by one resolver at every place a path enters
      VeriFlow — the walk, the provider's evidence, `status`, and the freshness estimate — because two
      resolvers would eventually disagree about what is in the index. `analysis.exclude` in
      config.yaml turned out never to have been applied at all: `captureSnapshot` was always called
      without it. It is documented as superseded and `veriflow doctor` names the entries nothing
      covers, rather than being quietly wired up into a second mechanism.
  F002:
    title: Code intelligence provider protocol and code-review-graph adapter
    spec: 02-code-intelligence-provider.md
    iteration: M1-answer
    status: shipped
    dependsOn: [F001]
    outcome: The project is indexed and queryable through one replaceable adapter.
  F003:
    title: Reachability, module registry, and function-level call graph
    spec: 03-reachability-and-call-graph.md
    iteration: M1-answer
    status: shipped
    dependsOn: [F002]
    outcome: >-
      The application's module registry, plus the functions a flow reaches and the traffic between
      modules.
    notes: >-
      Entry point detection was six path conventions, all of them framework shapes, and the first
      repository to expose what that costs was this one: with the mockups excluded it indexed to zero
      entry points and an empty call graph. That was a true statement about the detector and a false
      picture of the code — a repository that ships a command and sixteen packages is not a repository
      with no way in. It says where it is entered in `package.json`, so `bin` and `exports` are now
      read as what they are: a declaration by the author, which is stronger evidence than a path
      convention, not weaker. A `bin` roots at the target file's top level, because a command runs its
      module and nothing calls it. An `exports` entry roots at each function the named module
      publishes, which needs the module's own export statements — nothing in the provider's index
      records what is exported — followed through re-exports, since a barrel that forwards its surface
      would otherwise look like a package with no public functions at all. Resolution has to survive
      the ordinary case of a manifest pointing at `dist/index.js` when the index holds `src/index.ts`,
      and a declaration that resolves to nothing is reported rather than dropped, because silence
      about a door VeriFlow was told about reads as "there are none".

      Two monorepo assumptions surfaced with it. Port and callback inference only considered symbols
      under `src/`, so in a workspace both rules inferred nothing at all; `.veriflowignore` is what
      keeps non-application code out, and a second filter on a path prefix only decided which layouts
      the feature worked on. And `veriflow callgraph` and `veriflow entrypoints` read the provider
      directly without applying the ignore, so they drew what `veriflow index` had refused to store.

      On this repository: 153 doors, of which one is the `veriflow` command, and that one command
      reaches 409 of the 440 reachable functions. The difference between those two closures is the
      useful reading — what the command does, against what the packages publish beyond it.
  F004:
    title: Streamed agent session with the user's own client
    spec: 04-agent-session.md
    iteration: M1-answer
    status: shipped
    dependsOn: [F001, F002]
    outcome: >-
      The user's agent runs visibly, can be answered mid-run, and its transcript is stored.
  F005:
    title: Flow answer contract, question intake, and citation verification
    spec: 05-flow-answer-contract.md
    iteration: M1-answer
    status: shipped
    dependsOn: [F003, F004]
    outcome: A cited flow answer is validated, labelled per claim, and stored.
  F006:
    title: Local UI over stored answers
    spec: 06-answer-ui.md
    iteration: M1-answer
    status: shipped
    dependsOn: [F005]
    outcome: >-
      The generated architecture of the project, plus ask, flow, paths, modules, external systems
      and call graph on real data.
    notes: >-
      Ask shipped after the rest of the screen set, and its absence had been invisible: every other
      criterion was met, so the feature read as finished while the one thing that makes it an
      application rather than a viewer was missing. Asking from the browser now starts the same F004
      session `veriflow ask` starts — one plan, one prompt, one transcript in one store — and the
      console reads that transcript from the database rather than from a buffer, so replaying and
      following are the same code path and a run started in the terminal is watchable in the browser.

      The call graph screen was the second thing to read as finished while missing what it was for.
      It drew the function map and listed the traffic, and the two criteria that make the map usable
      on a real repository — filtering to one entry point, and the call mesh — were simply absent, so
      740 identical dots and a table of numbers were the whole screen. It is now the three views the
      spec asks for: the map, the module matrix with the diagonal counted, and the caller/callee
      hierarchy for one function. Filtering to a door dims what it does not reach and never reflows,
      the mesh is off by default and refuses to draw past a budget, and the whole interactive surface
      is five query parameters, so a view of it can be sent to somebody.
    gaps:
      - >-
        Corrections have their schema, their provenance and their store methods, but no editing
        surface in the browser: a step cannot be corrected in place, and closing a demoted step's
        open question by hand has no UI path.
      - >-
        Threads are stored — an answer knows its parent — but the answers list is flat, so a
        follow-up appears as a sibling rather than under what it followed up on.
      - >-
        Evidence opens in VeriFlow's own read-only source view rather than in the user's editor.
        This is a deliberate reversal, asserted in the F008 tests, not an omission.
  F007:
    title: Freshness, drift, and re-verification
    spec: 07-freshness-and-drift.md
    iteration: M2-review
    status: shipped
    dependsOn: [F005, F006]
    outcome: Changed cited files and per-citation drift, re-verified without re-answering.
    notes: >-
      Owns the freshness thresholds. F010's file-level estimate is the cheap grade of the same
      ladder and can be escalated by a verification, never contradicted by one.
  F008:
    title: Flow metrics — debt, structure, coupling, coverage proxy
    spec: 08-flow-metrics.md
    iteration: M3-depth
    status: shipped
    dependsOn: [F005, F006]
    outcome: Debt, structure, coupling and a labelled coverage proxy for the flow's files.
    notes: >-
      Every metric names the tool it mirrors and the rule that produced it, and nothing is blended
      into a score: where two measures disagree, both are reported and the entry names the term that
      drove the number. Unlocks get_metrics and get_coverage_gaps on the MCP surface, which were
      deliberately absent until now rather than present and empty.
  F009:
    title: Document export and portable backup
    spec: 09-document-export.md
    iteration: M3-depth
    status: shipped
    dependsOn: [F005, F006]
    outcome: Approved answers become committed markdown with generated mermaid.
    notes: >-
      Writes one file, into a configured documentation root, with no Git command of any kind: not
      add, not status, not check-ignore. Nothing is overwritten without the caller naming the
      revision it replaces, the approval diff is computed from the bytes that will land, and the
      portable dump carries what a re-index cannot rebuild with every absolute path removed.
  F010:
    title: VeriFlow MCP server for design and review
    spec: 10-mcp-server.md
    iteration: M2-review
    status: shipped
    dependsOn: [F005, F006]
    outcome: Any agent designs and reviews against stored, freshness-stamped results.
  F011:
    title: The project as the union of its answers
    spec: 11-project-view.md
    iteration: M4-many
    status: shipped
    dependsOn: [F005, F006, F010]
    outcome: >-
      Shared modules, the modules no answer reaches, and what a change to one file lands in — in the
      browser and on the MCP read surface.
    notes: >-
      The first feature whose subject is the set of answers rather than one of them, which is what
      made the honesty rules load-bearing: a superseded answer is excluded from coverage and the
      exclusion counted, so "nothing explains this" can never come from a quietly dropped row; the
      same answer is shown in impact and labelled, because a file about to change deserves the
      answer that used to describe it. Reach is a citation count and says so where it is displayed —
      citing a file in a module is not explaining the module.
  F012:
    title: Claim checking over hand-written documents
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F001, F007]
    outcome: >-
      `veriflow check-claims` extracts file-and-line claims from specs, issues and ADRs and reports
      whether each still resolves, using the same anchors and freshness ladder as stored answers.
    notes: "Implemented by WP1; checks are tree-state reads and are deliberately not persisted."
  F013:
    title: Change impact against a base ref
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F007, F011]
    outcome: >-
      `veriflow impact --diff` maps changed hunks, not only changed files, onto the cited lines of
      stored flows and states what an empty result does and does not prove.
    notes: "Implemented by WP2; no schema change and no PR bot."
  F014:
    title: Review and decision verbs
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F005, F006, F010]
    outcome: >-
      A person can mark an answer reviewed with provenance and can decide an open question without
      rewriting the immutable submitted answer; every read surface serves the result immediately.
    notes: "Implemented by WP3, WP4 and WP5, including the schema migration runner."
  F015:
    title: Proposed flows, proposed modules, and the answer diff
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F004, F005, F006, F009, F014]
    outcome: >-
      `veriflow propose` stores how a reviewed flow should change, including code and modules that do
      not exist yet, and one conservative matcher compares observed, proposed and built answers.
    notes: "Implemented by WP6 and WP7a; intent citations are counted separately from code evidence."
  F016:
    title: Invariant index
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F005, F007, F010, F011]
    outcome: >-
      The CLI, browser and MCP group the invariants asserted by live answers, with freshness and
      visible exclusions, without pretending to check or score them.
    notes: "Implemented by WP7b; read-only and schema-free."
  F017:
    title: The proposed change drawn on the diagram
    spec: ../docs/product/design-and-review-loop-plan.md
    iteration: M5-design
    status: shipped
    dependsOn: [F006, F009, F015]
    outcome: >-
      A shareable overlay draws added, removed, moved and unchanged flow steps, lanes, modules and
      contracts; proposal-only architecture is labelled not built and exports carry a text fallback.
    notes: "Implemented by WP8; browser SVG is coloured and Mermaid uses explicit textual markers."

blocking:
  - question: Q2
    blocks: [F002, F003]
    status: answered
    note: Spike run on 2026-07-30; measurements recorded in questions.yaml and open-questions.md.
